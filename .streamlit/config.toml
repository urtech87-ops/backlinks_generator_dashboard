# Dashboard theme. Calm, high-contrast, one accent colour — the status colours
# (red / orange / yellow / green) have to be the loudest thing on screen, so
# the chrome stays quiet.
[theme]
base = "light"
primaryColor = "#2f6f6a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f6"
textColor = "#1f2328"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
headless = true
